<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Outer Glow Circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#accent)" stroke-width="8" opacity="0.15"/>
  
  <!-- Vintén Logo Icon -->
  <g transform="translate(116, 116) scale(11.666)" stroke="url(#accent)" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- Círculo moneda -->
    <path d="M 5 8 A 8 8 0 1 0 19 10" fill="none" stroke-width="2.5" />
    <!-- V de Crecimiento -->
    <path d="M 5 8 L 12 16 L 19 4" fill="none" stroke-width="2.5" />
    <!-- Flecha -->
    <path d="M 13 4 L 19 4 L 19 10" fill="none" stroke-width="2.5" />
  </g>
</svg>
